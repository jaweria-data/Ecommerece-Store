<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Anomaly Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #111827; text-align: center; margin-bottom: 10px; }
        p { text-align: center; color: #6b7280; margin-bottom: 30px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; display: block; margin: 0 auto; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { padding: 15px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background-color: #f9fafb; color: #374151; font-weight: bold; }
        tr:hover { background-color: #f9fafb; }
        .error { color: #dc2626; text-align: center; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 E-Commerce Price Monitor</h1>
        <p>Live customer dashboard for tracking unusual price changes.</p>
        
        <button onclick="fetchJsonData()">View Live Pricing Data</button>
        <div id="statusMessage" class="error"></div>

        <table id="dataTable" style="display:none;">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Product Name</th>
                    <th>Current Price (PKR)</th>
                    <th>Price Change (%)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        async function fetchJsonData() {
            const statusMessage = document.getElementById("statusMessage");
            const dataTable = document.getElementById("dataTable");
            const tableBody = document.getElementById("tableBody");
            
            statusMessage.innerHTML = "Fetching secure JSON data...";
            statusMessage.style.color = "#2563eb";
            dataTable.style.display = "none";
            tableBody.innerHTML = "";

            try {
                // Fetching the JSON payload directly from your FastAPI backend
               const response = await fetch("https://gizmo-carve-reforest.ngrok-free.dev/api/v1/anomalies", {
    headers: {
        "ngrok-skip-browser-warning": "true"
    }
});
                const result = await response.json();

                if (result.status === "Success" && result.data.length > 0) {
                    statusMessage.innerHTML = "";
                    dataTable.style.display = "table";

                    // Loop through the JSON data and build HTML rows
                    result.data.forEach(item => {
                        const row = `<tr>
                            <td>${item.fetch_date}</td>
                            <td>${item.product_name}</td>
                            <td>Rs. ${item.price}</td>
                            <td style="color: #dc2626; font-weight: bold;">${parseFloat(item.daily_inflation_pct).toFixed(1)}%</td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                } else {
                    statusMessage.innerHTML = "System normal. No anomalies detected.";
                    statusMessage.style.color = "#059669";
                }
            } catch (error) {
                statusMessage.innerHTML = "Connection Error: Please ensure your FastAPI backend is running.";
                statusMessage.style.color = "#dc2626";
            }
        }
    </script>

</body>
</html>
